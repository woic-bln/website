name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every Sunday at 10:45 UTC = 11:45 CET (Berlin winter) / 12:45 CEST (Berlin summer)
    - cron: '45 09 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BASE_PATH: /website
          SITE_URL: https://woic-bln.github.io

      - name: Verify build output
        run: node scripts/verify-build.mjs
        env:
          BASE_PATH: /website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cpanel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro for cPanel
        run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BASE_PATH: /
          SITE_URL: ${{ secrets.CPANEL_SITE_URL }}

      - name: Inject PHP DB config
        run: |
          node -e "
          const fs = require('fs');
          const cfg = '<?php\n' +
            'define(\"DB_HOST\", ' + JSON.stringify(process.env.H) + ');\n' +
            'define(\"DB_NAME\", ' + JSON.stringify(process.env.N) + ');\n' +
            'define(\"DB_USER\", ' + JSON.stringify(process.env.U) + ');\n' +
            'define(\"DB_PASS\", ' + JSON.stringify(process.env.P) + ');\n';
          fs.writeFileSync('dist/api/config.php', cfg);
          "
        env:
          H: ${{ secrets.CPANEL_DB_HOST }}
          N: ${{ secrets.CPANEL_DB_NAME }}
          U: ${{ secrets.CPANEL_DB_USER }}
          P: ${{ secrets.CPANEL_DB_PASS }}

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          dangerous-clean-slate: true
